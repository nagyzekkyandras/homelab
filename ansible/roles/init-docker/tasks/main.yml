- name: Base packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Docker GPG kulcs könyvtárának létrehozása
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Docker GPG kulcs letöltése
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Docker tároló hozzáadása (biztonságos módon)
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker engine and components
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: NVIDIA Container Toolkit GPG kulcs letöltése
  get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    mode: '0644'

- name: NVIDIA Container Toolkit tároló hozzáadása
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /"
    state: present
    filename: nvidia-container-toolkit

- name: NVIDIA Container Toolkit telepítése
  apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: yes

- name: Docker service újraindítása az NVIDIA támogatás aktiválásához
  systemd:
    name: docker
    state: restarted

- name: Gitea stack mappa létrehozása az /opt alatt
  file:
    path: /opt/gitea-stack
    state: directory
    mode: '0755'
  when: deploy_gitea | default(false) | bool

- name: Docker Compose fájl generálása a Jinja sablonból
  template:
    src: docker-compose-gitea.yml.j2
    dest: /opt/gitea-stack/docker-compose.yml
    mode: '0644'
  when: deploy_gitea | default(false) | bool

- name: Gitea Docker Compose stack elindítása
  community.docker.docker_compose_v2:
    project_src: /opt/gitea-stack
    state: present
  when: deploy_gitea | default(false) | bool

- name: n8n stack főmappa létrehozása az /opt alatt
  file:
    path: /opt/n8n-stack
    state: directory
    mode: '0755'
  when: deploy_n8n | default(false) | bool

- name: n8n adatmappa létrehozása a megfelelő node UID/GID-vel (Jogosultság fix)
  file:
    path: /opt/n8n-stack/n8n-data
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0775'
  when: deploy_n8n | default(false) | bool

- name: n8n Docker Compose fájl generálása a Jinja sablonbóll
  template:
    src: docker-compose-n8n.yml.j2
    dest: /opt/n8n-stack/docker-compose.yml
    mode: '0644'
  when: deploy_n8n | default(false) | bool

- name: n8n Docker Compose stack elindítása
  community.docker.docker_compose_v2:
    project_src: /opt/n8n-stack
    state: present
  when: deploy_n8n | default(false) | bool

- name: AI Docker Compose fájl generálása a Jinja sablonból
  template:
    src: docker-compose-ollama.yml.j2
    dest: /opt/ai-stack/docker-compose.yml
    mode: '0644'
  when: deploy_ai | default(false) | bool

- name: AI Docker Compose stack elindítása
  community.docker.docker_compose_v2:
    project_src: /opt/ai-stack
    state: present
  when: deploy_ai | default(false) | bool

- name: Kivárjuk, amíg az Ollama szerver teljesen elindul
  wait_for:
    port: 11434
    host: localhost
    delay: 5
    timeout: 300
  when: deploy_ai | default(false) | bool

- name: A hivatalos Qwen2.5 3B modell letöltése az Ollama-ba
  shell:
    cmd: docker exec ollama-backend ollama pull qwen2.5:3b
  register: model_pull
  changed_when: "'success' in model_pull.stdout"
  when: deploy_ai | default(false) | bool

- name: code főmappa létrehozása az /opt alatt
  file:
    path: /opt/code
    state: directory
    mode: '0755'
  when: deploy_code | default(false) | bool

- name: code adatmappa létrehozása a megfelelő node UID/GID-vel (Jogosultság fix)
  file:
    path: /opt/code/data
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0775'
  when: deploy_code | default(false) | bool

- name: code Docker Compose fájl generálása a Jinja sablonból
  template:
    src: docker-compose-code.yml.j2
    dest: /opt/code/docker-compose.yml
    mode: '0644'
  when: deploy_code | default(false) | bool

- name: code Docker Compose elindítása
  community.docker.docker_compose_v2:
    project_src: /opt/code
    state: present
  when: deploy_code | default(false) | bool

